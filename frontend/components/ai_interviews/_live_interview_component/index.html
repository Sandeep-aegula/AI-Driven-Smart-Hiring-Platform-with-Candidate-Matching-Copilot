<script>
/*
 * AI Interview module -- immersive full-screen live interview.
 *
 * This component "portals" its UI directly into the parent document body
 * (the exact same technique already used elsewhere in this app by
 * frontend/components/ai_assistant.py for its floating widget) so the
 * interview can take over the full viewport, visually covering the normal
 * HR sidebar/header/nav without touching or modifying any of their code.
 * Nothing about those other elements is altered -- they are simply
 * covered by a fixed, full-screen overlay while an interview is active,
 * and the overlay is removed when the interview ends, restoring the
 * normal view untouched.
 *
 * IMPORTANT teardown rule: because the overlay is portaled into the PARENT
 * document (not this component's own iframe), Streamlit re-rendering this
 * component with new props (e.g. stop=true) does NOT reliably reach the
 * browser before a following st.rerun() unmounts the iframe that would have
 * carried that message -- the overlay can be left stuck on screen. So any
 * teardown that follows a user click (finishing the interview, going back)
 * calls teardown() DIRECTLY in the click handler, synchronously, before
 * anything is sent back to Python. stop=true from Python is kept only for
 * abort paths where no further click is coming.
 *
 * No camera. Voice only: TTS (speechSynthesis) for the AI interviewer,
 * live SpeechRecognition (interim + final results) for the candidate,
 * with a 5-second continuous-silence timer to auto-finalize each answer.
 * A one-click gate requests real OS-level full-screen (not just filling the
 * browser viewport) before the interview starts, since the Fullscreen API
 * requires a direct user gesture.
 */

function sendToStreamlit(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setFrameHeight(h) {
  sendToStreamlit("streamlit:setFrameHeight", { height: h || 1 });
}
function sendValue(value) {
  sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
}
sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
// This component renders nothing in its own iframe -- everything is
// portaled into the parent document -- so keep the iframe itself at 0 height.
setFrameHeight(1);

const SILENCE_MS = 5000;
// If the candidate never says anything at all after a question is asked,
// don't wait forever -- move on after this much total silence.
const NO_ANSWER_TIMEOUT_MS = 10000;
const POLL_MS = 200;
const WAVE_BARS = 9;

const parentDoc = window.parent.document;
const ROOT_ID = "hirepilot-ai-interview-root";

let seq = 0;
let currentArgs = null;
let lastHandledIndex = -1;
let recognition = null;
let recognizing = false;
let finalTranscript = "";
let interimTranscript = "";
let lastSpeechTime = 0;
let silenceTimer = null;
let tornDown = false;
let els = null; // cached DOM refs into the portaled overlay
let gateDismissed = false;
let pendingQuestionText = null;

function waveBarsHtml(cls) {
  let html = "";
  for (let i = 0; i < WAVE_BARS; i++) html += `<span class="${cls}-bar b${i % 5}"></span>`;
  return html;
}

      @keyframes popIn { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    stateLabel: root.querySelector("#ai-iv-state-label"),
    stateText: root.querySelector("#ai-iv-state-text"),
    questionText: root.querySelector("#ai-iv-question-text"),
    responsePanel: root.querySelector("#ai-iv-response-panel"),
    responseLabel: root.querySelector("#ai-iv-response-label"),
    responseText: root.querySelector("#ai-iv-response-text"),
    progressLabel: root.querySelector("#ai-iv-progress-label"),
    progressFill: root.querySelector("#ai-iv-progress-fill"),
    tabBanner: root.querySelector("#ai-iv-tab-banner"),
    completion: root.querySelector("#ai-iv-completion"),
    completionIconWrap: root.querySelector("#ai-iv-completion-icon-wrap"),
    completionBadge: root.querySelector("#ai-iv-completion-badge"),
    completionBtn: root.querySelector("#ai-iv-completion-btn"),
  };

  els.gateBtn.onclick = dismissGate;
  els.completionBtn.onclick = onBackToListClick;

  parentDoc.addEventListener("visibilitychange", onVisibilityChange);
}

function onVisibilityChange() {
  if (!els) return;
  els.tabBanner.style.display = parentDoc.hidden ? "block" : "none";
}

function requestFullscreenSafely() {
  try {
    const el = parentDoc.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) {
      const p = req.call(el);
      if (p && p.catch) p.catch(() => {}); // ignore rejection (e.g. user dismissed / unsupported)
    }
  } catch (e) { /* ignore -- interview still works windowed */ }
}

function exitFullscreenSafely() {
  try {
    const isFs = parentDoc.fullscreenElement || parentDoc.webkitFullscreenElement;
    if (!isFs) return;
    const exit = parentDoc.exitFullscreen || parentDoc.webkitExitFullscreen;
    if (exit) {
      const p = exit.call(parentDoc);
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) { /* ignore */ }
}

function showSection(name) {
  if (!els) return;
  els.gate.style.display = name === "gate" ? "flex" : "none";
  els.interviewContent.style.display = name === "interview" ? "flex" : "none";
  els.completion.style.display = name === "completion" ? "flex" : "none";
  els.progressWrap.style.display = name === "interview" ? "block" : "none";
  els.footerNote.style.display = name === "interview" ? "block" : "none";
}

function dismissGate() {
  if (gateDismissed) return;
  gateDismissed = true;
  requestFullscreenSafely();
  showSection("interview");
  if (pendingQuestionText) speakQuestion(pendingQuestionText);
}

const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DOT_ICON = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#94A3B8"/></svg>';

function showCompletion(result) {
  if (!els) return;
  try { window.speechSynthesis.cancel(); } catch (e) {}
  try { recognition && recognition.stop(); } catch (e) {}
  if (silenceTimer && silenceTimer !== "done") clearInterval(silenceTimer);
  recognizing = false;

  const tier = result === "PASS" ? "pass" : result === "FAIL" ? "fail" : "pending";
  const icon = tier === "pass" ? CHECK_ICON : tier === "fail" ? CROSS_ICON : DOT_ICON;
  els.completionIconWrap.className = "completion-icon-wrap " + tier;
  els.completionIconWrap.innerHTML = icon;
  els.completionBadge.className = "completion-badge " + tier;
  els.completionBadge.textContent = tier === "pending" ? "Result Pending" : ("Result: " + result);

  showSection("completion");
}

function onBackToListClick() {
  // Synchronous, client-side teardown -- do not wait for a Python round
  // trip. See the top-of-file note on why this must happen here.
  teardown();
  sendValue({ type: "back_to_list" });
}

function renderProgress(index, total) {
  if (!els) return;
  els.progressLabel.textContent = "Question " + (index + 1) + " of " + total;
  const pct = Math.round(((index + 1) / total) * 100);
  els.progressFill.style.width = pct + "%";
}

function renderResponse(liveText, placeholder) {
  if (!els) return;
  if (liveText) {
    els.responseText.innerHTML = escapeHtml(liveText);
  } else {
    els.responseText.innerHTML = '<span class="response-placeholder">' + escapeHtml(placeholder) + "</span>";
  }
}

function escapeHtml(s) {
  const d = parentDoc.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function setState(state, label) {
  if (!els) return;
  els.avatarWrap.className = "avatar-wrap " + state;
  els.waveRow.className = "wave-row " + state;
  els.stateLabel.className = "state-label " + state;
  els.stateText.textContent = label;
  els.responsePanel.className = "response-panel" + (state === "listening" ? " listening" : "");
}

function setQuestionText(text) {
  if (!els) return;
  els.questionText.style.animation = "none";
  // Force reflow so the fade-up animation replays for the new question.
  void els.questionText.offsetWidth;
  els.questionText.style.animation = "";
  els.questionText.textContent = text;
}

// Without headphones, the mic can pick up the AI's own voice coming out of
// the speakers a beat after speechSynthesis reports "ended" (trailing
// playback tail / OS audio buffering). A short settle delay before opening
// the mic, plus the echo check in checkSilence() below, are the two guards
// against that being transcribed and submitted as the candidate's answer.
const POST_SPEECH_SETTLE_MS = 600;

function speakQuestion(text) {
  setState("speaking", "Speaking");
  setQuestionText(text);
  els.responseLabel.innerHTML = "Your Response";
  renderResponse("", "Listen to the question...");
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.0;
    utter.onend = () => setTimeout(startListening, POST_SPEECH_SETTLE_MS);
    utter.onerror = () => setTimeout(startListening, POST_SPEECH_SETTLE_MS);
    window.speechSynthesis.speak(utter);
  } catch (e) {
    startListening();
  }
}

function normalizeWords(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
}

// True when `text` is (near-)verbatim the question that was just asked --
// the signature of the mic hearing the AI speak rather than a real answer.
// Requires both high word overlap AND a similar overall length so a
// legitimate answer that references a couple of words from the question
// (very common) is never mistaken for an echo.
function looksLikeEcho(text, question) {
  const q = normalizeWords(question);
  const a = normalizeWords(text);
  if (q.length < 4 || a.length < 4) return false;
  const qSet = new Set(q);
  let overlap = 0;
  for (const w of a) if (qSet.has(w)) overlap++;
  const overlapRatio = overlap / Math.min(q.length, a.length);
  const lengthRatio = a.length / q.length;
  return overlapRatio >= 0.75 && lengthRatio >= 0.55 && lengthRatio <= 1.7;
}

function getRecognitionCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function startListening() {
  if (tornDown) return;
  const Ctor = getRecognitionCtor();
  if (!Ctor) {
    setState("idle", "Unavailable");
    renderResponse("", "Live speech recognition isn't supported in this browser. Please use Chrome or Edge.");
    return;
  }
  finalTranscript = "";
  interimTranscript = "";
  lastSpeechTime = Date.now();
  setState("listening", "Listening");
  els.responseLabel.innerHTML = 'Your Response &nbsp;<span class="mic-wave"><span></span><span></span><span></span><span></span></span>';
  renderResponse("", "Start speaking whenever you're ready...");

  recognition = new Ctor();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  recognition.onresult = (event) => {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const piece = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += piece + " ";
      else interim += piece;
    }
    interimTranscript = interim;
    lastSpeechTime = Date.now();
    renderResponse((finalTranscript + " " + interimTranscript).trim(), "");
  };

  recognition.onerror = (event) => {
    if (event.error === "no-speech" || event.error === "aborted") return;
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      renderResponse("", "Microphone access is required for the AI interview.");
      return;
    }
    renderResponse("", "Sorry, I couldn't hear your response. Please continue.");
  };

  recognition.onend = () => {
    recognizing = false;
    if (!tornDown && silenceTimer !== "done") {
      try { recognition.start(); recognizing = true; } catch (e) { /* already starting */ }
    }
  };

  try { recognition.start(); recognizing = true; } catch (e) { /* ignore double-start */ }

  if (silenceTimer) clearInterval(silenceTimer);
  silenceTimer = setInterval(checkSilence, POLL_MS);
}

function checkSilence() {
  const combined = (finalTranscript + " " + interimTranscript).trim();
  const elapsed = Date.now() - lastSpeechTime;

  if (!combined) {
    // The candidate hasn't said anything at all since this question started
    // (lastSpeechTime is set when listening begins and only moves forward
    // once real speech comes in) -- don't wait forever for them to start;
    // move on to the next question after a longer grace period.
    if (elapsed >= NO_ANSWER_TIMEOUT_MS) {
      finalizeAnswer("(No response provided within the time limit.)");
    }
    return;
  }

  if (elapsed < SILENCE_MS) return;

  const question = currentArgs && currentArgs.question;
  if (looksLikeEcho(combined, question)) {
    // The mic almost certainly heard the AI ask the question, not the
    // candidate answering it -- discard and keep listening for a real
    // answer instead of submitting the echo.
    finalTranscript = "";
    interimTranscript = "";
    lastSpeechTime = Date.now();
    renderResponse("", "Didn't catch a clear response — please continue speaking...");
    return;
  }

  finalizeAnswer(combined);
}

function finalizeAnswer(text) {
  clearInterval(silenceTimer);
  silenceTimer = "done";
  try { recognition && recognition.stop(); } catch (e) {}
  recognizing = false;
  setState("thinking", "Thinking...");
  els.responseLabel.innerHTML = "Your Response";
  renderResponse(text, "");
  seq += 1;
  sendValue({ type: "transcript_final", seq: seq, question_index: currentArgs.question_index, text: text });
}

function teardown() {
  tornDown = true;
  try { window.speechSynthesis.cancel(); } catch (e) {}
  try { recognition && recognition.stop(); } catch (e) {}
  if (silenceTimer && silenceTimer !== "done") clearInterval(silenceTimer);
  exitFullscreenSafely();
  removeOverlay();
}

function removeOverlay() {
  const root = parentDoc.getElementById(ROOT_ID);
  if (root) root.remove();
  parentDoc.removeEventListener("visibilitychange", onVisibilityChange);
  els = null;
}

function onRender(args) {
  currentArgs = args;

  if (args.stop) { teardown(); return; }

  buildOverlay();

  if (args.completed) {
    showCompletion(args.result);
    return;
  }

  renderProgress(args.question_index, args.total_questions);

  if (args.question_index !== lastHandledIndex) {
    lastHandledIndex = args.question_index;
    if (silenceTimer && silenceTimer !== "done") clearInterval(silenceTimer);
    try { recognition && recognition.stop(); } catch (e) {}
    if (gateDismissed) {
      speakQuestion(args.question);
    } else {
      pendingQuestionText = args.question;
      showSection("gate");
    }
  }
}

window.addEventListener("message", (event) => {
  if (event.data && event.data.type === "streamlit:render") {
    onRender(event.data.args || {});
  }
});

window.addEventListener("beforeunload", () => {
  removeOverlay();
});
</script>
</body>
</html>
