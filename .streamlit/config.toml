[theme]
base = "light"
primaryColor = "#6366F1"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[runner]
fastReruns = true

[logger]
level = "error"
